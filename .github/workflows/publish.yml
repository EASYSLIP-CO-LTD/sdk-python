name: Publish
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # Create version pull requests or attach release artifacts.
      id-token: write # Obtain short-lived publishing or attestation identity.
      attestations: write # Store signed artifact provenance.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        # Resolve and inspect only the release commit.

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -m pip install -r requirements-dev.lock
      - name: Check release version
        run: |
          python - <<'PYCODE'
          import os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)
          with open('pyproject.toml', 'rb') as file:
              assert tomllib.load(file)['project']['version'] == tag[1:]
          PYCODE
      - run: python -m build && python -m twine check dist/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
      - name: Install the published version
        run: |
          python -m venv /tmp/published
          /tmp/published/bin/pip install "easyslip-sdk==${RELEASE_TAG#v}"
          cd /tmp
          /tmp/published/bin/python "$GITHUB_WORKSPACE/scripts/consumer.py"
